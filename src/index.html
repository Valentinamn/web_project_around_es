<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Around The U.S.</title>

    <!-- Vendor CSS -->
<link rel="stylesheet" href="../vendor/normalize.css" />
<link rel="stylesheet" href="../vendor/fonts.css" />
<link rel="stylesheet" href="./pages/index.css" />
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          alt="Logotipo Around The U.S."
          class="logo header__logo"
          src="./images/logo.svg"
        />
      </header>

      <main class="content">
        <!-- SECCIÓN PERFIL -->
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <img
              class="profile__image"
              src="./images/avatar.jpg"
              alt="Avatar"
            />
            <button
              class="profile__avatar-edit-button"
              aria-label="Editar avatar"
              type="button"
            ></button>
          </div>

          <div class="profile__info">
            <h1 class="profile__title">Valentina Montoya</h1>
            <button
              aria-label="Editar perfil"
              class="profile__edit-button"
              type="button"
            ></button>
            <p class="profile__description">Exploradora</p>
          </div>
          <button
            aria-label="Agregar tarjeta"
            class="profile__add-button"
            type="button"
          ></button>
        </section>

        <!-- SECCIÓN TARJETAS -->
        <section class="cards page__section">
          <ul class="cards__list"></ul>

          <!-- Template para las tarjetas dinámicas -->
          <template id="card-template">
            <li class="card">
              <img class="card__image" src="" alt="" />
              <button
                aria-label="Eliminar tarjeta"
                class="card__delete-button"
                type="button"
              ></button>
              <div class="card__description">
                <h2 class="card__title"></h2>
                <button
                  aria-label="Botón Me gusta"
                  class="card__like-button"
                  type="button"
                ></button>
              </div>
            </li>
          </template>
        </section>
      </main>

      <footer class="footer page__section">
        <p class="footer__copyright">© 2025 Around The U.S.</p>
      </footer>

      <!-- POPUP EDITAR PERFIL -->
      <div class="popup" id="edit-popup">
        <div class="popup__content">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Editar perfil</h3>
          <form class="popup__form" id="edit-profile-form">
            <input
              id="profile-name"
              class="popup_input popup_input_type_name"
              name="name"
              placeholder="Nombre"
              type="text"
              required
              minlength="2"
              maxlength="40"
            />
            <span class="popup__input-error" id="profile-name-error"></span>

            <input
              id="profile-description"
              class="popup_input popup_input_type_description"
              name="description"
              placeholder="Acerca de mí"
              type="text"
              required
              minlength="2"
              maxlength="200"
            />
            <span
              class="popup__input-error"
              id="profile-description-error"
            ></span>

            <button class="button popup__button" type="submit">Guardar</button>
          </form>
        </div>
      </div>

      <!-- POPUP NUEVA TARJETA -->
      <div class="popup" id="new-card-popup">
        <div class="popup__content">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Nuevo lugar</h3>
          <form class="popup__form" id="new-card-form">
            <input
              id="card-title"
              class="popup_input popup_input_type_card-name"
              name="place-name"
              placeholder="Título"
              required
              type="text"
              minlength="2"
              maxlength="30"
            />
            <span class="popup__input-error" id="card-title-error"></span>

            <input
              id="card-link"
              class="popup_input popup_input_type_url"
              name="link"
              placeholder="Enlace a la imagen"
              required
              type="url"
            />
            <span class="popup__input-error" id="card-link-error"></span>

            <button class="button popup__button" type="submit">Crear</button>
          </form>
        </div>
      </div>

      <!-- POPUP CAMBIAR AVATAR -->
      <div class="popup" id="avatar-popup">
        <div class="popup__content">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Actualizar avatar</h3>
          <form class="popup__form" id="avatar-form">
            <input
              id="avatar-link"
              class="popup_input popup_input_type_url"
              name="avatar"
              placeholder="Enlace de la imagen"
              required
              type="url"
            />
            <span class="popup__input-error" id="avatar-link-error"></span>
            <button class="button popup__button" type="submit">Guardar</button>
          </form>
        </div>
      </div>

      <!-- POPUP CONFIRMACIÓN ELIMINAR TARJETA -->
      <div class="popup" id="confirm-popup">
        <div class="popup__content">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">¿Estás seguro?</h3>
          <button
            id="confirm-delete"
            class="button popup__button"
            type="button"
          >
            Sí
          </button>
        </div>
      </div>

      <!-- POPUP IMAGEN -->
    <div class="popup" id="image-popup">
  <div class="popup__content popup__content_content_image">
    <button
      aria-label="Cerrar ventana emergente"
      class="popup__close"
      type="button"
    ></button>
    <img class="popup__image" src="#" alt="" />
    <p class="popup__caption"></p>
  </div>
</div>

    <!-- Script principal -->
    <script type="module" src="./pages/index.js"></script>
  </body>
</html>
